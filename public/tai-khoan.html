<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Đăng nhập vào Forma để đặt đơn hàng demo.">
  <title>Tài khoản | Forma</title>
  <link rel="icon" href="/assets/forma.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/store.css">
  <script type="module" src="/assets/account.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main class="shell inside" id="main">
    <div id="account" class="account-layout">
      <div class="page-title">
        <h1 id="account-title">Tài khoản<span class="accent">.</span></h1>
        <p id="account-intro">Đăng nhập để đặt đơn hàng trên Forma.</p>
      </div>
      <div id="account-status" role="status">Đang kiểm tra phiên…</div>
      <!-- Cookie phiên do máy chủ cấp. Biểu mẫu không lưu mật khẩu trong trình duyệt. -->
      <form class="form-stack" id="login" hidden>
        <label>Email <input type="email" name="email" autocomplete="username" required maxlength="254"></label>
        <label>Mật khẩu <input type="password" name="password" autocomplete="current-password" required maxlength="256"></label>
        <p class="feedback" id="login-error" role="alert" hidden></p>
        <button class="button" type="submit">Đăng nhập</button>
        <div id="demo-login" class="demo-login" hidden>
          <p>Tài khoản demo <strong>demo@forma.vn</strong><br>Mật khẩu <strong>FormaDemo2026</strong></p>
          <button type="button" class="text-link" id="fill-demo">Điền tài khoản demo</button>
        </div>
      </form>
      <section id="profile" class="form-stack" hidden aria-labelledby="profile-title">
        <h2 id="profile-title">Thông tin tài khoản</h2>
        <p id="profile-email"></p>
        <button class="button subtle" id="logout" type="button">Đăng xuất</button>
      </section>
    </div>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
